{% extends 'base.html' %}
{% block content %}
<h1>{{ entry.title }}</h1>
<p class="text-muted">{{ entry.created_at|date:"d.m.Y H:i" }}</p>
<div class="card"><div class="card-body">{{ entry.content|linebreaks }}</div></div>
<div class="mt-3">
    <a href="{% url 'entry_update' entry.pk %}" class="btn btn-warning">Редактировать</a>
    <a href="{% url 'entry_delete' entry.pk %}" class="btn btn-danger">Удалить</a>
    <a href="{% url 'entry_list' %}" class="btn btn-secondary">Назад</a>
</div>
{% endblock %}
