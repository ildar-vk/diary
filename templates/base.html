{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный дневник</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link id="theme-style" rel="stylesheet" href="{% static 'css/diary.css' %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">📓 Дневник</a>
            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <a class="nav-link" href="{% url 'entry_create' %}">✍️ Новая запись</a>
                    <a class="nav-link" href="#" id="theme-toggle" onclick="toggleTheme()">🎨 Стиль</a>
                    <form method="post" action="{% url 'logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-link nav-link">🚪 Выйти</button>
                    </form>
                {% else %}
                    <a class="nav-link" href="{% url 'login' %}">Войти</a>
                    <a class="nav-link" href="{% url 'register' %}">Регистрация</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>

    <script>
        const DIARY_CSS = '{% static "css/diary.css" %}';
        const PLAIN_CSS = '{% static "css/plain.css" %}';

        function toggleTheme() {
            const link = document.getElementById('theme-style');
            const current = link.getAttribute('href');

            if (current === DIARY_CSS || current.includes('diary.css')) {
                link.setAttribute('href', PLAIN_CSS);
                localStorage.setItem('theme', 'plain');
            } else {
                link.setAttribute('href', DIARY_CSS);
                localStorage.setItem('theme', 'diary');
            }
        }

        (function() {
            const theme = localStorage.getItem('theme');
            const link = document.getElementById('theme-style');
            if (theme === 'plain') {
                link.setAttribute('href', PLAIN_CSS);
            }
        })();
    </script>
</body>
</html>
